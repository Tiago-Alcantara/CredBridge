version: "3.9"

services:
  pix-service:
    build:
      context: ./pix-service
      dockerfile: Dockerfile
    container_name: pix-service
    restart: always
    expose:
      - "8000"
    ports:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PIX_PROVIDER=${PIX_PROVIDER:-corpx}
      - CORPX_ENV=${CORPX_ENV:-production}
      - CORPX_API_BASE_URL=${CORPX_API_BASE_URL}
      - CORPX_AUTH_BASE_URL=${CORPX_AUTH_BASE_URL}
      - CORPX_CLIENT_ID=${CORPX_CLIENT_ID}
      - CORPX_CLIENT_SECRET=${CORPX_CLIENT_SECRET}
      - CORPX_SCOPE=${CORPX_SCOPE:-api2/read api2/write}
      - CORPX_TENANT_ID=${CORPX_TENANT_ID}
      - CORPX_ACCOUNT_ID=${CORPX_ACCOUNT_ID}
      - CORPX_RECEIVER_PIX_KEY=${CORPX_RECEIVER_PIX_KEY}
      - CORPX_WEBHOOK_SECRET=${CORPX_WEBHOOK_SECRET}
      - CREDBRIDGE_API_URL=${CREDBRIDGE_API_URL}
      - CREDBRIDGE_PIX_WEBHOOK_PATH=${CREDBRIDGE_PIX_WEBHOOK_PATH:-/v1/pix/webhooks/orders}
      - CREDBRIDGE_PIX_WEBHOOK_SECRET=${CREDBRIDGE_PIX_WEBHOOK_SECRET}
      - CREDBRIDGE_PIX_SERVICE_API_KEY=${CREDBRIDGE_PIX_SERVICE_API_KEY}
      - DEFAULT_QR_EXPIRATION_SECONDS=${DEFAULT_QR_EXPIRATION_SECONDS:-1800}
      - CALLBACK_MAX_ATTEMPTS=${CALLBACK_MAX_ATTEMPTS:-5}
      - CALLBACK_BASE_DELAY_SECONDS=${CALLBACK_BASE_DELAY_SECONDS:-30}
      - PYTHONUNBUFFERED=1

