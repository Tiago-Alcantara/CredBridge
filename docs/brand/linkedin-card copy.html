    }
    .logo-row {
      display: inline-flex;

    .wordmark {
      font-weight: 700;
      font-size: 52px;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .wordmark .cred   { color: #7B2FFF; }
    .wordmark .bridge { color: #111111; }
    .dot {
      width: 11px; height: 11px;
      border-radius: 50%;
      background: #00FF94;
      box-shadow: 0 0 14px #00FF94;
      flex-shrink: 0;
    }
    .tagline {
      font-size: 18px;
      font-weight: 500;
      color: rgba(10,10,26,0.65);
      letter-spacing: -0.01em;
      position: relative;
    }
    .chips {
      display: flex;
      gap: 12px;
      position: relative;
    }
    .chip {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 18px;
      border-radius: 999px;
      border: 1px solid;
      letter-spacing: 0.02em;
    }
    .chip-cyan   { color: #00D4FF; background: rgba(0,212,255,0.08);   border-color: rgba(0,212,255,0.30); }
    .chip-violet { color: #7B2FFF; background: rgba(123,47,255,0.10);  border-color: rgba(123,47,255,0.35); }
    .chip-green  { color: #00FF94; background: rgba(0,255,148,0.08);   border-color: rgba(0,255,148,0.30); }
