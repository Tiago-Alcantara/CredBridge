version: "3.9"

services:
  # ------------------------------------------------------------------ #
  # Database (for API)
  # ------------------------------------------------------------------ #
  db:
    image: postgres:16-alpine
    container_name: credbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credbridge}
      POSTGRES_DB: ${POSTGRES_DB:-credbridge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - credbridge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credbridge} -d ${POSTGRES_DB:-credbridge}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------ #
  # Main API Service (NestJS)
  # ------------------------------------------------------------------ #
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credbridge-api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://credbridge:credbridge@db:5432/credbridge
      PIX_SERVICE_BASE_URL: ${PIX_SERVICE_BASE_URL:-http://host.docker.internal:8001}
      PIX_SERVICE_API_KEY: ${PIX_SERVICE_API_KEY:-dev_api_key_change_in_production}
      PIX_WEBHOOK_SECRET: ${PIX_WEBHOOK_SECRET:-dev_webhook_secret_change_in_production}
      PORT: 3001
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ------------------------------------------------------------------ #
  # Web Frontend Service (Next.js)
  # ------------------------------------------------------------------ #
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: credbridge-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - api

volumes:
  credbridge-db-data:
